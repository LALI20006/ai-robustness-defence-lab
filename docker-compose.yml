version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./app.db
      - JWT_SECRET_KEY=production-secure-random-token-secret-change-me
      - MAX_UPLOAD_MB=50
    volumes:
      - app_data:/app/data
      - app_models:/app/models/saved_models
      - app_reports:/app/reports
    restart: unless-stopped

volumes:
  app_data:
  app_models:
  app_reports:
