services:
  - type: web
    name: ai-robustness-defence-lab
    runtime: python
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DATABASE_URL
        value: "sqlite:///./app.db"
      - key: MAX_UPLOAD_MB
        value: "50"
